model:

  name: "dstnet"

  hidden_dim: 256

  embedding_dim: 256

  num_heads: 8

  num_encoder_layers: 2

  dropout: 0.1

  num_modes: 6

  future_steps: 30

  enable_refinement: false

  refinement_iterations: 1

  interaction_radius: 30.0

  arp_mspa:

    r_min: 2.0

    r_max: 30.0

    radius_hidden_dim: 256

  mhca:

    window_sizes:
      - 2
      - 4
      - 8

    causal: true

    use_multi_scale: true

  enable_bezier: true
