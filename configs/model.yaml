model:

  name: "dstnet"

  hidden_dim: 256

  embedding_dim: 256

  num_heads: 8

  num_encoder_layers: 2

  dropout: 0.1

  num_modes: 6

  future_steps: 30

  enable_refinement: true

  refinement_iterations: 2

  interaction_radius: 30.0

  mspa:

    radii:
      - 2.0
      - 5.0
      - 10.0
      - 20.0
      - 30.0
      - 40.0
      - 60.0
      - inf

    feature_dropout: 0.1

  mhca:

    window_sizes:
      - 2
      - 4
      - 8

    causal: true

    use_multi_scale: true

  enable_bezier: true
